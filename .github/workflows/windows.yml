name: Windows

# The entire per-repo cost of Windows CI. The Nix install and cache, the
# target-existence guard, the cold-cache refusal, the PE-format gate, the
# artifact hand-off and its round-trip check all live once in
# logos-co/logos-windows-ci.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  windows:
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      # Both halves: the static library, and the plugin that links it. The
      # plugin is the one that proves the whole chain -- it is where a mingw
      # libmicrohttpd, the Winsock shim and libverifproxy.a's undefined native
      # symbols all have to agree.
      targets: |
        libverifproxy
        default
      # `default` stages verified_proxy_module_plugin.dll, so the loose-PE floor
      # is met; the archive floor keeps libverifproxy's own tree honest, since a
      # target that staged nothing would otherwise hide behind the other one.
      min-pes: 1
      min-archives: 1
      # NO SMOKE, and that is a coverage gap rather than a pass. A Logos module
      # plugin has no entry point of its own -- it is loaded by a host, and this
      # repo exposes no Windows host target to load it with. What the harness
      # still proves without one is the PE format and the import closure, which
      # is where a bundled-DLL mistake shows up.
      #
      # The archive gate adds what neither covers: that the library target
      # actually emitted its entry points. Upstream's installPhase collects only
      # `-type f -executable`, which for a .a and a .h yields an empty $out.
      extra-gates: bash .github/gates/verifproxy-archive.sh
