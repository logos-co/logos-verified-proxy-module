name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Slowest green build on record is 22m52s, and on a cold cache this
    # becomes the ~25 minute libverifproxy source build noted below. 60 is
    # roomy for that while still catching a wedged fetch in an hour, not six.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          # Keep READING the old Cachix while the Attic caches fill up. The
          # rust crate derivations this build needs are in Cachix and in no
          # other cache -- so dropping it outright did not just cost cache
          # hits, it turned "substitute a prebuilt path" into "build it from
          # source", which fails. Credential-free: the cache is public, and
          # nothing publishes here any more. Remove once Attic has the paths.
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      # libverifproxy is a ~25 minute source build of the whole nimbus/Nim
      # toolchain, so the Logos cache is doing real work here rather than
      # shaving seconds.
      - name: Build module
        run: nix build -L

  test:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Same closure as `build` plus the suite, so it takes the same bound.
    # test (ubuntu-latest) has never once completed: all six runs on record
    # hung mid-fetch and died at GitHub's 6 hour ceiling.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          # Keep READING the old Cachix while the Attic caches fill up. The
          # rust crate derivations this build needs are in Cachix and in no
          # other cache -- so dropping it outright did not just cost cache
          # hits, it turned "substitute a prebuilt path" into "build it from
          # source", which fails. Credential-free: the cache is public, and
          # nothing publishes here any more. Remove once Attic has the paths.
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      # The check derivation RUNS the suite as part of building it, so a red
      # test is a failed build. Named explicitly rather than via `nix flake
      # check`, which would also evaluate the x86_64-windows pseudo-system.
      - name: Unit tests
        run: |
          nix build -L ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).unit-tests"

  codegen:
    runs-on: ubuntu-latest
    # A checkout and one python script; observed worst is 7 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The 60 typed eth_*/op_* wrappers are generated from the library's own
      # dispatch table but COMMITTED as literal text, because the module's code
      # generator parses verified_proxy_impl.h as text and cannot see through a
      # macro. This proves nobody hand-edited the generated blocks, and that a
      # bumped nimbus input has not left them behind.
      - name: RPC wrappers match the generator
        run: python3 tools/gen_rpc_methods.py --check
